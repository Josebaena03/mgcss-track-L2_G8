name: Release Workflow

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Build, Package, Docker and Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'zulu'
          cache: 'maven'

      - name: Compilar, probar y analizar con Sonar (Quality Gate)
        working-directory: ./l2g8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B clean verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.projectKey=Josebaena03_mgcss-track-L2_G8 -Dsonar.qualitygate.wait=true

      - name: Subir artefacto generado
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: l2g8/target/*.jar

      - name: Iniciar sesión en GitHub Container Registry (GHCR)
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Construir y publicar imagen Docker
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE_TAG="ghcr.io/${OWNER_LOWER}/mgcss-track:${{ github.ref_name }}"
          docker build -t mgcss-track:${{ github.ref_name }} -t $IMAGE_TAG ./l2g8
          docker push $IMAGE_TAG

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: l2g8/target/*.jar
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}